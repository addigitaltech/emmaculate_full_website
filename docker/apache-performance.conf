# Apache tuning for a small container (for example a 512 MB Render instance).
# The default of 150 workers would use far more memory than a small instance has and crash under load.
<IfModule mpm_prefork_module>
    StartServers             3
    MinSpareServers          3
    MaxSpareServers          6
    MaxRequestWorkers        20
    MaxConnectionsPerChild   400
</IfModule>

KeepAlive On
KeepAliveTimeout 4
Timeout 60
ServerTokens Prod
ServerSignature Off

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml application/javascript application/json image/svg+xml
</IfModule>
