; Production PHP settings for the Docker image (Render and any other container host).
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; The image never changes after it is built, so PHP does not need to re-check files on every request.
opcache.validate_timestamps=0
realpath_cache_size=4096K
realpath_cache_ttl=600
memory_limit=256M
upload_max_filesize=10M
post_max_size=12M
max_execution_time=60
expose_php=0
